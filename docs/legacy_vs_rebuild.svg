<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="800" viewBox="0 0 1130 800" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker></defs>
<rect width="1130" height="800" fill="#ffffff"/>
<text x="450" y="62" font-size="28" fill="#1e1e1e">Legacy vs rebuild</text>
<text x="296" y="94" font-size="18" fill="#757575">Same six stages. Only one side tells you what it dropped.</text>
<rect x="60" y="120" width="320" height="46" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text x="220.0" y="150.7" font-size="22" fill="#1e1e1e" text-anchor="middle">Legacy Alteryx</text>
<rect x="480" y="120" width="320" height="46" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="640.0" y="150.7" font-size="22" fill="#1e1e1e" text-anchor="middle">Rebuilt in SQL</text>
<rect x="60" y="196" width="320" height="58" rx="10" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
<text x="220.0" y="231.3" font-size="18" fill="#1e1e1e" text-anchor="middle">1. Read 2 CSVs</text>
<rect x="480" y="196" width="320" height="58" rx="10" fill="#d0ebff" stroke="#4a9eed" stroke-width="2"/>
<text x="640.0" y="231.3" font-size="18" fill="#1e1e1e" text-anchor="middle">1. Land 4 CSVs as text</text>
<rect x="60" y="291" width="320" height="58" rx="10" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
<text x="220.0" y="326.3" font-size="18" fill="#1e1e1e" text-anchor="middle">2. Filter status + date</text>
<text x="64" y="370" font-size="16" fill="#c92a2a">3 records gone, no log</text>
<rect x="480" y="291" width="320" height="58" rx="10" fill="#d0ebff" stroke="#4a9eed" stroke-width="2"/>
<text x="640.0" y="326.3" font-size="18" fill="#1e1e1e" text-anchor="middle">2. Conform and validate</text>
<rect x="60" y="386" width="320" height="58" rx="10" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
<text x="220.0" y="421.3" font-size="18" fill="#1e1e1e" text-anchor="middle">3. Summarize to AUM</text>
<text x="64" y="465" font-size="16" fill="#c92a2a">duplicate row counted twice</text>
<rect x="480" y="386" width="320" height="58" rx="10" fill="#d0ebff" stroke="#4a9eed" stroke-width="2"/>
<text x="640.0" y="421.3" font-size="18" fill="#1e1e1e" text-anchor="middle">3. Build billable AUM</text>
<rect x="60" y="481" width="320" height="58" rx="10" fill="#ffe8cc" stroke="#f59e0b" stroke-width="3"/>
<text x="220.0" y="516.3" font-size="18" fill="#1e1e1e" text-anchor="middle">4. Inner join, J anchor only</text>
<text x="64" y="560" font-size="16" fill="#c92a2a">6 records gone. $2.45M unbilled</text>
<rect x="480" y="481" width="320" height="58" rx="10" fill="#d0ebff" stroke="#4a9eed" stroke-width="2"/>
<text x="640.0" y="516.3" font-size="18" fill="#1e1e1e" text-anchor="middle">4. Join, unmatched logged</text>
<rect x="60" y="576" width="320" height="58" rx="10" fill="#ffe8cc" stroke="#f59e0b" stroke-width="2"/>
<text x="220.0" y="611.3" font-size="18" fill="#1e1e1e" text-anchor="middle">5. Rate / 4, minimum first</text>
<text x="64" y="655" font-size="16" fill="#c92a2a">one rate on the whole balance</text>
<rect x="480" y="576" width="320" height="58" rx="10" fill="#d0ebff" stroke="#4a9eed" stroke-width="2"/>
<text x="640.0" y="611.3" font-size="18" fill="#1e1e1e" text-anchor="middle">5. Marginal tiers, days / 365</text>
<rect x="60" y="671" width="320" height="58" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="3"/>
<text x="220.0" y="706.3" font-size="18" fill="#1e1e1e" text-anchor="middle">6. billing 116, exceptions 0</text>
<text x="64" y="750" font-size="16" fill="#c92a2a">empty every run since 2019</text>
<rect x="480" y="671" width="320" height="58" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="3"/>
<text x="640.0" y="706.3" font-size="18" fill="#1e1e1e" text-anchor="middle">6. billing 115, exceptions 29</text>
<text x="484" y="750" font-size="16" fill="#15803d">every variance attributed, 0 defects</text>
<rect x="850" y="291" width="230" height="200" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="3"/>
